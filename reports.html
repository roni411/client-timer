<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דוחות — Client Timer</title>
  <link rel="stylesheet" href="reports.css">
  <!-- SheetJS for Excel export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- SIGN-IN OVERLAY -->
<div id="signin-overlay" style="display:none;position:fixed;inset:0;background:#f4f6fb;z-index:100;display:flex;align-items:center;justify-content:center">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:32px">
    <div style="font-size:40px">📊</div>
    <div style="font-size:20px;font-weight:700">דוחות זמן</div>
    <div style="font-size:13px;color:#9ca3af;margin-bottom:8px">התחברי כדי לטעון את הנתונים שלך</div>
    <button id="btn-signin" style="display:flex;align-items:center;gap:10px;padding:11px 20px;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.566 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      התחברי עם Google
    </button>
  </div>
</div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back-link">← חזרה לטיימר</a>
      <div class="topbar-title">📊 דוחות זמן</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-add-manual" id="btn-add-manual">+ רשומה ידנית</button>
      <button class="btn-excel" id="btn-export">📗 ייצוא ל-Excel</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="card">
    <div class="filter-grid">

      <div class="filter-group">
        <div class="filter-label">לקוחות</div>
        <div class="pills" id="client-pills"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label">תקופה</div>
        <div class="date-presets">
          <button class="preset-btn" data-preset="week">השבוע</button>
          <button class="preset-btn active" data-preset="month">החודש</button>
          <button class="preset-btn" data-preset="3months">3 חודשים</button>
          <button class="preset-btn" data-preset="all">הכל</button>
        </div>
        <div class="date-range">
          <input class="date-input" type="date" id="date-from" />
          <span class="date-sep">—</span>
          <input class="date-input" type="date" id="date-to" />
        </div>
      </div>

    </div>
  </div>

  <!-- SUMMARY CHIPS -->
  <div class="chips-row" id="chips-row"></div>

  <!-- MANUAL ENTRY -->
  <div class="card" id="manual-entry-card" style="display:none">
    <div class="manual-entry-title">הוספת רשומה ידנית</div>
    <div class="manual-entry-grid">
      <div class="manual-field">
        <label>לקוח</label>
        <select id="manual-client" class="date-input" style="width:100%"></select>
      </div>
      <div class="manual-field">
        <label>תאריך</label>
        <input type="date" id="manual-date" class="date-input" style="width:100%" />
      </div>
      <div class="manual-field">
        <label>שעת התחלה</label>
        <input type="time" id="manual-start" class="date-input" style="width:100%" />
      </div>
      <div class="manual-field">
        <label>שעת סיום</label>
        <input type="time" id="manual-end" class="date-input" style="width:100%" />
      </div>
      <div class="manual-field manual-field-wide">
        <label>פעילות</label>
        <input type="text" id="manual-activity" class="date-input" style="width:100%" placeholder="תיאור הפעילות..." />
      </div>
    </div>
    <div class="manual-entry-actions">
      <button class="btn-save-manual" id="btn-save-manual">✓ שמור רשומה</button>
      <button class="btn-cancel-manual" id="btn-cancel-manual">ביטול</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>לקוח</th>
          <th>פעילות</th>
          <th>שעת התחלה</th>
          <th>שעת סיום</th>
          <th>משך</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

<script src="sheets.js"></script>
<script src="reports.js"></script>
</body>
</html>
