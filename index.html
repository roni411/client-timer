<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<div id="app">

  <!-- ════ PANEL: IDLE ════ -->
  <div id="panel-idle" class="panel active">
    <div class="widget-header">
      <div class="header-left">
        <span>Client Timer</span>
      </div>
      <div class="header-right">
        <button class="icon-btn purple" id="btn-open-edit" title="עריכת לקוחות">⚙</button>
        <button class="icon-btn" id="btn-minimize-idle" title="מזעור">—</button>
      </div>
    </div>

    <select class="client-select" id="client-select">
      <option value="">בחרי לקוח...</option>
    </select>

    <input class="activity-input" id="activity-input" type="text" placeholder="פעילות (אופציונלי)..." />

    <button class="btn btn-green" id="btn-start">▶ התחל</button>

    <a href="reports.html" class="reports-link">📊 דוחות</a>
  </div>

  <!-- ════ PANEL: RUNNING ════ -->
  <div id="panel-running" class="panel">
    <div class="widget-header">
      <div class="header-left">
        <span class="dot-red"></span>
        <span>פעיל</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btn-minimize-running" title="מזעור">—</button>
      </div>
    </div>

    <div class="timer-client-name" id="running-client-name"></div>
    <div class="timer-display" id="timer-display">00:00:00</div>

    <input class="activity-input" id="activity-input-running" type="text" placeholder="פעילות (אופציונלי)..." />

    <button class="btn btn-red" id="btn-stop">⏹ עצור</button>

    <a href="reports.html" class="reports-link">📊 דוחות</a>
  </div>

  <!-- ════ PANEL: EDIT ════ -->
  <div id="panel-edit" class="panel">
    <div class="widget-header">
      <div class="header-left">
        <span>עריכת לקוחות</span>
      </div>
      <div class="header-right">
        <button class="icon-btn purple" id="btn-close-edit" title="חזרה">✕</button>
      </div>
    </div>

    <div class="edit-list" id="edit-list"></div>

    <button class="add-btn" id="btn-add-client">+ הוסף לקוח</button>
    <button class="btn btn-purple" id="btn-save-clients">✓ שמור וחזור</button>
  </div>

</div>

<!-- ════ MINI BAR (minimized state) ════ -->
<div id="mini-bar">
  <div class="mini-status" id="mini-status">
    <span id="mini-indicator">⏸</span>
    <span id="mini-time"></span>
  </div>
  <button class="mini-action-btn" id="mini-action-btn"></button>
  <button class="mini-expand-btn" id="btn-expand" title="הרחב">⬆</button>
</div>

<!-- ════ NOTIFICATION PERMISSION BAR ════ -->
<div class="notif-bar" id="notif-bar" style="display:none">
  <span>אפשרי תזכורות כדי שלא תשכחי לעצור</span>
  <button id="btn-allow-notif">אפשרי</button>
</div>

<!-- ════ SIGN-IN OVERLAY ════ -->
<div id="signin-overlay" style="display:none">
  <div class="signin-box">
    <div class="signin-icon">⏱</div>
    <div class="signin-title">Client Timer</div>
    <div class="signin-sub">התחברי כדי לשמור את הנתונים שלך</div>
    <button class="signin-btn" id="btn-signin">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.566 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      התחברי עם Google
    </button>
  </div>
</div>

<script src="sheets.js"></script>
<script src="app.js"></script>
</body>
</html>
